<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おひめさま きせかえ</title>
<style>
  :root {
    --pink: #ff7fb6;
    --pink-dark: #e85a9b;
    --pink-light: #ffe3f0;
    --cream: #fff8fb;
    --purple: #a678e8;
    --text: #6b3a5b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text); background: var(--pink-light);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; padding: 0; touch-action: manipulation; }

  #app { display: grid; height: 100vh; height: 100dvh; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: minmax(0, 1fr); }
  @media (orientation: portrait) {
    #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 52fr) minmax(0, 48fr); }
  }
  body.done #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  body.done #panel, body.done .edit-only { display: none; }
  body:not(.done) .done-only { display: none; }

  /* ---------- ステージ ---------- */
  #stage { position: relative; overflow: hidden; min-height: 0; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  #doll { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  body.done #doll { animation: dance 1.4s ease-in-out infinite; transform-origin: 200px 600px; }
  @keyframes dance {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(4deg) translateY(-12px); }
  }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.45s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .spark { transform-box: fill-box; transform-origin: center; animation: spark 0.8s ease-out forwards; pointer-events: none; }
  @keyframes spark {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.2) rotate(90deg); opacity: 1; }
    100% { transform: scale(0) rotate(180deg); opacity: 0; }
  }

  .round-btn {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: #fff; font-size: 32px; line-height: 1;
    box-shadow: 0 4px 0 rgba(160, 80, 130, 0.25), 0 6px 14px rgba(160, 80, 130, 0.2);
    display: grid; place-items: center;
  }
  .round-btn:active, .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(160, 80, 130, 0.25); }
  #btnSound { top: 12px; right: 12px; }
  #doneBtns { position: absolute; bottom: 16px; left: 0; right: 0; justify-content: center; gap: 16px; flex-wrap: wrap; }
  body.done #doneBtns { display: flex; }
  .big-btn {
    padding: 12px 30px; border-radius: 999px; white-space: nowrap;
    background: linear-gradient(#ff9cc8, var(--pink)); color: #fff;
    font-size: 26px; font-weight: 800; letter-spacing: 0.05em;
    box-shadow: 0 5px 0 var(--pink-dark), 0 8px 16px rgba(160, 80, 130, 0.3);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
  }
  .big-btn.alt { background: #fff; color: var(--pink-dark); text-shadow: none; box-shadow: 0 5px 0 #f3bcd6, 0 8px 16px rgba(160, 80, 130, 0.2); }
  #banner {
    position: absolute; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-size: clamp(34px, 8vw, 64px); font-weight: 900; color: var(--pink-dark);
    text-shadow: 0 0 6px #fff, 0 0 6px #fff, 0 0 12px #fff, 0 0 20px #fff;
    animation: bannerIn 0.7s cubic-bezier(.3, 1.8, .5, 1);
  }
  @keyframes bannerIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .confetti { position: absolute; top: -60px; pointer-events: none; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }

  /* ---------- えらぶパネル ---------- */
  #panel {
    display: flex; flex-direction: column; min-height: 0; gap: 10px; padding: 10px;
    background: var(--cream); box-shadow: 0 0 20px rgba(160, 80, 130, 0.25); z-index: 1;
  }
  #tabs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .tab {
    border-radius: 14px; background: #fff; padding: 4px 0 3px; min-width: 0; overflow: hidden;
    border: 3px solid var(--pink-light); display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .tab .ico { font-size: clamp(22px, 4vmin, 36px); line-height: 1.1; }
  .tab .lbl { font-size: clamp(9px, 1.45vmin, 13px); font-weight: 700; white-space: nowrap; letter-spacing: -0.04em; }
  @media (max-width: 640px) { .tab { padding: 6px 0; } .tab .lbl { display: none; } }
  .tab.on { background: var(--pink); border-color: var(--pink-dark); color: #fff; transform: scale(1.04); }
  #items {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(92px, 15vmin, 130px), 1fr)); gap: 10px;
    grid-auto-rows: max-content; align-content: start; padding: 10px;
  }
  .item {
    position: relative; aspect-ratio: 1; border-radius: 22px; background: #fff;
    border: 5px solid var(--pink-light); overflow: hidden;
    box-shadow: 0 4px 0 rgba(160, 80, 130, 0.15);
  }
  .item:active { transform: scale(0.94); }
  .item svg { width: 100%; height: 100%; display: block; }
  .item.on { border-color: var(--pink); background: #fff0f7; }
  .item.on::after {
    content: "✓"; position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--pink); color: #fff; font-weight: 900; font-size: 18px; display: grid; place-items: center;
  }
  .item .none { font-size: 20px; font-weight: 800; color: #d9a9c3; }

  #actions { display: grid; grid-template-columns: 1fr 1fr 1fr 1.5fr; gap: 8px; }
  .act {
    border-radius: 18px; background: #fff; border: 4px solid var(--pink-light); padding: 6px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 4px 0 rgba(160, 80, 130, 0.15);
  }
  .act:active { transform: translateY(3px); box-shadow: none; }
  .act .ico { font-size: clamp(24px, 4vmin, 34px); line-height: 1.1; }
  .act .lbl { font-size: clamp(10px, 1.7vmin, 14px); font-weight: 700; white-space: nowrap; }
  .act.go { background: linear-gradient(#ff9cc8, var(--pink)); border-color: var(--pink-dark); color: #fff; }
  .act.go .lbl { font-size: clamp(14px, 2.6vmin, 22px); font-weight: 800; }
  #hint { display: none; text-align: center; font-size: 12px; font-weight: 700; color: #c08aa8; }
  body.kbd #hint { display: block; }

  /* ---------- キーボードの カーソル ---------- */
  body.kbd .cur { outline: 6px solid #ffb300; outline-offset: 2px; position: relative; z-index: 2; animation: curPulse 1s ease-in-out infinite; }
  @keyframes curPulse { 0%, 100% { outline-color: #ffb300; } 50% { outline-color: #ff5c8a; } }

  /* ---------- アルバム ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--cream); display: flex; flex-direction: column; }
  .overlay[hidden], [hidden] { display: none !important; }
  .ov-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .ov-title { font-size: clamp(24px, 5vmin, 38px); font-weight: 900; color: var(--pink-dark); }
  #albumGrid {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 20vmin, 190px), 1fr)); gap: 14px; align-content: start;
  }
  .card {
    position: relative; aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; background: #fff;
    border: 5px solid var(--pink-light); box-shadow: 0 4px 0 rgba(160, 80, 130, 0.15);
  }
  .card svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .card .date, #viewDate {
    position: absolute; left: 50%; translate: -50% 0; bottom: 6px; white-space: nowrap;
    background: rgba(255, 255, 255, 0.9); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 800;
  }
  .empty { grid-column: 1 / -1; text-align: center; font-size: clamp(18px, 3.5vmin, 26px); font-weight: 800; line-height: 2; color: #c08aa8; margin-top: 12vh; }
  #viewStage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #viewStage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #viewDate { bottom: 10px; font-size: 18px; padding: 4px 18px; }
  #viewBtns, #confirm { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px; }
  #viewBtns .big-btn, #confirm .big-btn { font-size: clamp(16px, 3vmin, 24px); padding: 10px 22px; }
  #confirm .q { font-size: clamp(18px, 3.4vmin, 26px); font-weight: 900; width: 100%; text-align: center; }
</style>
</head>
<body>

<!-- 共通グラデーション -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gRainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fa3"/><stop offset=".2" stop-color="#ffc48a"/>
      <stop offset=".4" stop-color="#fff08a"/><stop offset=".6" stop-color="#a5e8a0"/>
      <stop offset=".8" stop-color="#8fd0ff"/><stop offset="1" stop-color="#c5a3ff"/>
    </linearGradient>
    <linearGradient id="gCastle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc9e3"/><stop offset="1" stop-color="#fff3d6"/></linearGradient>
    <linearGradient id="gGarden" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff"/><stop offset="1" stop-color="#e6f8ff"/></linearGradient>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a6b"/><stop offset="1" stop-color="#7a5bb8"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9ff"/><stop offset="1" stop-color="#fdf6ff"/></linearGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe3f0"/><stop offset="1" stop-color="#d9fbff"/></linearGradient>
    <linearGradient id="gKira" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3da"/><stop offset="1" stop-color="#c3a6ff"/></linearGradient>
    <linearGradient id="gSpace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1038"/><stop offset="1" stop-color="#4a3a9a"/></linearGradient>
    <linearGradient id="gSnow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d4ff"/><stop offset="1" stop-color="#f4faff"/></linearGradient>
    <linearGradient id="gCandy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6ec"/><stop offset="1" stop-color="#fff6d6"/></linearGradient>
    <linearGradient id="gStage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a52"/><stop offset="1" stop-color="#6a4ab0"/></linearGradient>
  </defs>
</svg>

<div id="app">
  <div id="stage">
    <svg viewBox="0 0 400 620" preserveAspectRatio="xMidYMid meet">
      <g id="bgL"></g>
      <g id="doll"></g>
      <g id="fx"></g>
    </svg>
    <button class="round-btn" id="btnSound" aria-label="おと">🔊</button>
    <div id="banner" class="done-only">できあがり!</div>
    <div id="doneBtns" class="done-only">
      <button class="big-btn" id="btnBack" data-nav="back">👗 もういちど</button>
      <button class="big-btn alt" id="btnAlbum2" data-nav="album">📖 アルバム</button>
    </div>
  </div>
  <div id="panel">
    <div id="tabs"></div>
    <div id="items"></div>
    <div id="actions">
      <button class="act" id="btnRandom" data-nav="act-random"><span class="ico">🎲</span><span class="lbl">おまかせ</span></button>
      <button class="act" id="btnReset" data-nav="act-reset"><span class="ico">🧹</span><span class="lbl">さいしょから</span></button>
      <button class="act" id="btnAlbum" data-nav="act-album"><span class="ico">📖</span><span class="lbl">アルバム</span></button>
      <button class="act go" id="btnDone" data-nav="act-done"><span class="ico">✨</span><span class="lbl">できた!</span></button>
    </div>
    <div id="hint">← ↑ ↓ → で えらぶ ・ Enter か スペースで きめる ・ Esc で もどる</div>
  </div>
</div>

<div id="album" class="overlay" hidden>
  <div class="ov-head">
    <div class="ov-title">📖 アルバム</div>
    <button class="big-btn alt" id="albumClose" data-nav="close">✕ もどる</button>
  </div>
  <div id="albumGrid"></div>
</div>

<div id="viewer" class="overlay" hidden>
  <div id="viewStage">
    <svg id="viewSvg" viewBox="0 0 400 620" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="viewDate"></div>
  </div>
  <div id="viewBtns">
    <button class="big-btn alt" id="viewPrev" data-nav="prev">◀ まえ</button>
    <button class="big-btn alt" id="viewNext" data-nav="next">つぎ ▶</button>
    <button class="big-btn" id="viewPlay" data-nav="play">👗 このこで あそぶ</button>
    <button class="big-btn alt" id="viewDel" data-nav="del">🗑 けす</button>
    <button class="big-btn alt" id="viewClose" data-nav="close">✕ もどる</button>
  </div>
  <div id="confirm" hidden>
    <div class="q">この おひめさまを けしても いい?</div>
    <button class="big-btn alt" id="delNo" data-nav="no">いいえ</button>
    <button class="big-btn" id="delYes" data-nav="yes">はい、けす</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= ずけいの ぶひん ================= */
const SKIN = '#ffdfc4';
const mirror = s => s + `<g transform="translate(400 0) scale(-1 1)">${s}</g>`;
const circle = (x, y, r, f, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${extra}/>`;
const star = (cx, cy, r, f, extra = '') => {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r;
    p.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
  }
  return `<polygon points="${p.join(' ')}" fill="${f}" stroke="${f}" stroke-width="${(r * 0.18).toFixed(1)}" stroke-linejoin="round" ${extra}/>`;
};
const heart = (cx, cy, s, f) =>
  `<path d="M${cx} ${cy + s * 0.9} C${cx - s * 1.7} ${cy - s * 0.2} ${cx - s * 0.7} ${cy - s * 1.4} ${cx} ${cy - s * 0.45} C${cx + s * 0.7} ${cy - s * 1.4} ${cx + s * 1.7} ${cy - s * 0.2} ${cx} ${cy + s * 0.9}Z" fill="${f}"/>`;
const flower = (cx, cy, r, petal, center = '#ffd84a') => {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    s += circle((cx + Math.cos(a) * r * 0.62).toFixed(1), (cy + Math.sin(a) * r * 0.62).toFixed(1), (r * 0.48).toFixed(1), petal);
  }
  return s + circle(cx, cy, (r * 0.36).toFixed(1), center);
};
const ribbon = (cx, cy, s, f, knot) =>
  `<path d="M${cx} ${cy} L${cx - s} ${cy - s * 0.7} Q${cx - s * 1.15} ${cy} ${cx - s} ${cy + s * 0.7}Z M${cx} ${cy} L${cx + s} ${cy - s * 0.7} Q${cx + s * 1.15} ${cy} ${cx + s} ${cy + s * 0.7}Z" fill="${f}" stroke="${f}" stroke-width="${s * 0.15}" stroke-linejoin="round"/>` +
  circle(cx, cy, s * 0.3, knot);
const NONE = { n: 'なし', none: true, d: () => '' };

/* ================= アイテム ================= */
const HAIR_COLORS = [
  { n: 'ちゃいろ', c: '#8a5530' }, { n: 'きんいろ', c: '#f7cb4d' }, { n: 'くろ', c: '#3a2e3f' },
  { n: 'ピンク', c: '#ff8fc0' }, { n: 'むらさき', c: '#a678e8' }, { n: 'みずいろ', c: '#5cc8e8' },
  { n: 'オレンジ', c: '#f2853f' },
];

const CAP = c => circle(200, 160, 67, c);
const HAIRS = [
  { n: 'ロングヘア', d: c => `<path d="M200 96 C120 96 125 180 122 260 C120 330 108 370 124 396 C150 408 166 380 170 330 L230 330 C234 380 250 408 276 396 C292 370 280 330 278 260 C275 180 280 96 200 96Z" fill="${c}"/>` },
  { n: 'ツインテール', d: c => CAP(c) + mirror(`<path d="M142 132 C85 128 58 220 74 322 C82 348 113 342 119 310 C123 260 136 215 152 190Z" fill="${c}"/>${circle(138, 140, 11, '#ff7fb6')}`) },
  { n: 'おだんご', d: c => CAP(c) + mirror(circle(132, 104, 28, c) + circle(146, 122, 9, '#ffd84a')) },
  { n: 'ボブ', d: c => `<path d="M200 96 C123 96 120 170 124 236 C140 254 162 248 166 226 L234 226 C238 248 260 254 276 236 C280 170 277 96 200 96Z" fill="${c}"/>` },
  { n: 'ふわふわ', d: c => CAP(c) + `<rect x="116" y="160" width="168" height="200" rx="30" fill="${c}"/>` +
      mirror(circle(128, 190, 27, c) + circle(117, 236, 29, c) + circle(111, 286, 31, c) + circle(118, 336, 29, c) + circle(132, 378, 25, c)) },
];
const BANGS = c => `<path d="M137 176 C128 68 272 68 263 176 C256 150 236 134 206 134 C200 150 176 162 137 176Z" fill="${c}"/>`;

const HAT_VB = '96 44 208 110';
const CROWNS = [
  NONE,
  { n: 'きんの かんむり', d: () => `<path d="M162 112 L154 62 L180 88 L200 52 L220 88 L246 62 L238 112Z" fill="#ffd23f" stroke="#ffd23f" stroke-width="6" stroke-linejoin="round"/>
      <rect x="158" y="102" width="84" height="14" rx="7" fill="#ffb300"/>` +
      circle(154, 60, 6, '#ff5c8a') + circle(200, 50, 7, '#ff5c8a') + circle(246, 60, 6, '#ff5c8a') +
      circle(180, 109, 4, '#6ad1ff') + circle(200, 109, 5, '#ff5c8a') + circle(220, 109, 4, '#6ad1ff') },
  { n: 'ティアラ', d: () => `<path d="M158 114 C170 98 186 94 200 68 C214 94 230 98 242 114 Q200 100 158 114Z" fill="#dfe8f5" stroke="#b9c7dc" stroke-width="3" stroke-linejoin="round"/>` +
      circle(200, 92, 8, '#ff7fb6') + circle(178, 104, 4, '#8fd0ff') + circle(222, 104, 4, '#8fd0ff') + circle(200, 66, 4, '#fff') },
  { n: 'おはなの かんむり', d: () => [[156, 116, '#ff8fb8'], [174, 106, '#fff'], [200, 101, '#ffb3d1'], [226, 106, '#fff'], [244, 116, '#ff8fb8']]
      .map(([x, y, c], i) => circle(x - 9, y + 5, 6, '#7fd18b') + flower(x, y, i === 2 ? 17 : 14, c)).join('') },
  { n: 'おほしさまの かんむり', d: () => `<path d="M158 114 Q200 98 242 114" stroke="#ffd23f" stroke-width="9" fill="none" stroke-linecap="round"/>` +
      star(200, 80, 24, '#ffd23f') + star(166, 98, 13, '#fff08a') + star(234, 98, 13, '#fff08a') + circle(200, 81, 5, '#fff') },
  { n: 'ハートの ティアラ', d: () => `<path d="M158 114 Q200 98 242 114" stroke="#ff9cc8" stroke-width="9" fill="none" stroke-linecap="round"/>` +
      heart(200, 84, 19, '#ff5c8a') + heart(168, 100, 9, '#ffb3d1') + heart(232, 100, 9, '#ffb3d1') + circle(193, 78, 4, '#fff', 'opacity=".8"') },
  { n: 'おおきな リボン', d: () => ribbon(200, 92, 44, '#ff7fb6', '#ff5c8a') },
  { n: 'キャップ', vb: HAT_VB, d: () => `<path d="M139 128 Q136 70 200 70 Q264 70 261 128Z" fill="#f2566e"/>
      <path d="M146 122 Q104 116 86 136 Q118 146 152 134Z" fill="#c93a55"/>` + circle(200, 72, 5, '#fff') + star(206, 104, 11, '#fff') },
  { n: 'ニットぼう', vb: HAT_VB, d: () => `<path d="M139 122 Q138 66 200 66 Q262 66 261 122Z" fill="#7fd9a8"/>
      <rect x="134" y="108" width="132" height="24" rx="12" fill="#d3f5e0"/>` +
      [156, 178, 200, 222, 244].map(x => `<path d="M${x} 112 V128" stroke="#7fd9a8" stroke-width="3" stroke-linecap="round"/>`).join('') + circle(200, 60, 15, '#ff8fb8') },
  { n: 'ベレーぼう', vb: HAT_VB, d: () => `<ellipse cx="204" cy="98" rx="72" ry="30" transform="rotate(-8 204 98)" fill="#c93a55"/>

  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (raw) {
    const s = upgrade(raw);
    for (const c of CATS) if (Number.isInteger(s[c.k]) && c.list[s[c.k]]) state[c.k] = s[c.k];
    muted = !!raw.muted;
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...state, muted })); } catch (e) {} };
let curTab = 0;

/* ================= アルバム(つくった おひめさま) ================= */
const ALBUM_KEY = 'princess-dressup-album-v1', ALBUM_MAX = 100;
let album = [];
try {
  const a = JSON.parse(localStorage.getItem(ALBUM_KEY) || '[]');
  album = a.filter(e => e && e.s).map(e => ({ t: e.t, s: upgrade(e.s) }))
    .filter(e => CATS.every(c => Number.isInteger(e.s[c.k]) && c.list[e.s[c.k]]));
} catch (e) {}
const saveAlbum = () => { try { localStorage.setItem(ALBUM_KEY, JSON.stringify(album)); } catch (e) {} };
const sameLook = (a, b) => CATS.every(c => a[c.k] === b[c.k]);
function addToAlbum() {
  if (album[0] && sameLook(album[0].s, state)) return;
  album.unshift({ t: Date.now(), s: { ...state } });
  if (album.length > ALBUM_MAX) album.length = ALBUM_MAX;
  saveAlbum();
}
const dateLabel = t => { const d = new Date(t); return `${d.getMonth() + 1}がつ ${d.getDate()}にち`; };

/* ================= おと ================= */
let actx = null;
const tone = (freq, at = 0, dur = 0.18, type = 'sine', vol = 0.18) => {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
};
const SCALE = [523, 587, 659, 784, 880, 1047];
const sfx = {
  on() { const i = Math.floor(Math.random() * 4); tone(SCALE[i], 0, 0.2, 'triangle'); tone(SCALE[i + 2], 0.09, 0.3, 'triangle'); tone(SCALE[i + 2] * 2, 0.18, 0.35, 'sine', 0.08); },
  off() { tone(440, 0, 0.12, 'sine', 0.12); tone(330, 0.07, 0.15, 'sine', 0.1); },
  tab() { tone(700, 0, 0.1, 'sine', 0.12); },
  move() { tone(620, 0, 0.05, 'sine', 0.06); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.13, 0.35, 'triangle', 0.16)); },
};
const speak = text => {
  if (muted || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.95; u.pitch = 1.4;
    speechSynthesis.speak(u);
  } catch (e) {}
};

/* ================= えがく ================= */
const $ = id => document.getElementById(id);
const hairColor = () => HAIR_COLORS[state.hairColor].c;
const layer = (k, html) => `<g data-k="${k}">${html}</g>`;

const FACE =
  `<g class="eyes">` + mirror(`<ellipse cx="177" cy="180" rx="9" ry="12" fill="#4a2c2a"/>${circle(174, 175, 3.6, '#fff')}${circle(180, 184, 1.8, '#fff')}
    <path d="M167 172 L162 168 M169 168 L166 163" stroke="#4a2c2a" stroke-width="2.4" stroke-linecap="round"/>`) + `</g>` +
  mirror(circle(160, 200, 11, '#ff9cb8', 'opacity=".55"')) +
  `<path d="M188 206 Q200 219 212 206" stroke="#e2557a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;

function dollHTML(st = state) {
  const state = st, c = HAIR_COLORS[st.hairColor].c, bag = BAGS[st.bag], btm = BOTTOMS[st.bottom];
  return layer('wings', WINGS[state.wings].d()) +
    layer('hair', HAIRS[state.hair].d(c)) +
    (bag.b ? bag.b() : '') +
    mirror(`<path d="M186 356 L178 582" stroke="${SKIN}" stroke-width="20" stroke-linecap="round"/>`) +
    layer('shoes', SHOES[state.shoes].d()) +
    mirror(`<path d="M158 272 L115 345" stroke="${SKIN}" stroke-width="18" stroke-linecap="round"/>`) +
    `<rect x="188" y="222" width="24" height="40" fill="${SKIN}"/>
     <path d="M168 262 Q200 244 232 262 L232 330 Q237 350 234 372 H166 Q163 350 168 330Z" fill="${SKIN}"/>` +
    (state.dress > 0 ? layer('dress', DRESSES[state.dress].d())
      : layer('bottom', btm.d()) + layer('top', TOPS[state.top].d()) + (btm.o ? btm.o() : '')) +
    layer('bag', bag.d()) +
    layer('wand', WANDS[state.wand].d()) +
    mirror(circle(115, 347, 11.5, SKIN)) +
    mirror(circle(139, 184, 9, SKIN)) +
    circle(200, 170, 62, SKIN) + FACE +
    layer('hairColor', BANGS(c)) +
    layer('earring', EARRINGS[state.earring].d()) +
    layer('necklace', NECKLACES[state.necklace].d()) +
    layer('glasses', GLASSES[state.glasses].d()) +
    layer('crown', CROWNS[state.crown].d()) +
    layer('ornament', ORNAMENTS[state.ornament].d());
}

const sceneHTML = st => `<g>${BGS[st.bg].d()}</g><g>${dollHTML(st)}</g>`;

function renderDoll(popKey) {
  $('bgL').innerHTML = BGS[state.bg].d();
  $('doll').innerHTML = dollHTML();
  if (popKey && popKey !== 'bg') {
    const g = $('doll').querySelector(`[data-k="${popKey}"]`);
    if (g) g.classList.add('pop');
  }
}

function thumb(cat, i) {
  const it = cat.list[i];
  if (it.none) return `<span class="none">なし</span>`;
  if (cat.k === 'hairColor') return `<svg viewBox="${cat.vb}">${circle(50, 50, 34, it.c)}${circle(39, 39, 9, '#fff', 'opacity=".45"')}</svg>`;
  let inner = (it.b ? it.b() : '') + it.d(hairColor()) + (it.o ? it.o() : '');
  if (cat.k === 'hair') inner += circle(200, 170, 62, SKIN) + BANGS(hairColor());
  const par = cat.k === 'bg' ? 'xMidYMid slice' : 'xMidYMid meet';
  return `<svg viewBox="${it.vb || cat.vb}" preserveAspectRatio="${par}">${inner}</svg>`;
}
// トップス・ボトムスは ドレスを きている あいだは「きていない」あつかい
const isOn = (cat, i) => state[cat.k] === i && !(isPart(cat.k) && state.dress > 0);

function renderTabs() {
  $('tabs').innerHTML = CATS.map((c, i) =>
    `<button class="tab${i === curTab ? ' on' : ''}" data-i="${i}" data-nav="tab-${i}"><span class="ico">${c.ico}</span><span class="lbl">${c.n}</span></button>`).join('');
  applyCursor();
}
function renderItems() {
  const cat = CATS[curTab];
  $('items').innerHTML = cat.list.map((it, i) =>
    `<button class="item${isOn(cat, i) ? ' on' : ''}" data-i="${i}" data-nav="item-${i}" aria-label="${it.n}">${thumb(cat, i)}</button>`).join('');
  applyCursor();
}
function selectTab(i) {
  curTab = i;
  renderTabs(); renderItems();
  $('items').scrollTop = 0;
  sfx.tab(); speak(CATS[curTab].n);
}

/* ================= キーボードの カーソル ================= */
const curKey = {};
const scopeEl = () =>
  !$('confirm').hidden ? $('confirm') : !$('viewer').hidden ? $('viewer') : !$('album').hidden ? $('album') :
  document.body.classList.contains('done') ? $('doneBtns') : $('panel');
const navList = () => [...scopeEl().querySelectorAll('button[data-nav]')].filter(b => b.offsetParent !== null);
function applyCursor(scroll) {
  document.querySelectorAll('.cur').forEach(n => n.classList.remove('cur'));
  const sc = scopeEl(), list = navList();
  if (!list.length) return null;
  const el = list.find(b => b.dataset.nav === curKey[sc.id]) || list[0];
  curKey[sc.id] = el.dataset.nav;
  el.classList.add('cur');
  if (scroll) el.scrollIntoView({ block: 'nearest' });
  return el;
}
function setCursor(key) { curKey[scopeEl().id] = key; return applyCursor(true); }
function moveCursor(dx, dy) {
  const list = navList(), cur = applyCursor();
  if (!cur) return;
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cand = [];
  for (const b of list) {
    if (b === cur) continue;
    const q = b.getBoundingClientRect(), x = q.left + q.width / 2, y = q.top + q.height / 2;
    if (dx) { if ((x - cx) * dx > 4 && q.bottom > r.top + 4 && q.top < r.bottom - 4) cand.push({ b, main: Math.abs(x - cx), sub: 0 }); }
    else if ((y - cy) * dy > 4) cand.push({ b, main: Math.abs(y - cy), sub: Math.abs(x - cx) });
  }
  let best = null;
  const isTab = cur.classList.contains('tab'), isItem = cur.classList.contains('item');
  if (isTab && dy > 0) {
    // しゅるいから したへ → その なかみへ(2だんめの しゅるいは ←→ で いく)
    best = list.find(b => b.dataset.nav === 'item-' + state[CATS[curTab].k]);
  } else if (isItem && dy < 0 && !cand.some(c => c.b.classList.contains('item'))) {
    best = list.find(b => b.dataset.nav === 'tab-' + curTab);
  } else if (cand.length) {
    const near = Math.min(...cand.map(c => c.main));
    best = cand.filter(c => c.main <= near + 10).sort((a, b) => a.sub - b.sub)[0].b;
  } else if (dx) {
    // はしっこでは つぎの だん へ
    best = list[(list.indexOf(cur) + dx + list.length) % list.length];
  }
  if (!best || best === cur) return;
  curKey[scopeEl().id] = best.dataset.nav;
  if (best.classList.contains('tab') && +best.dataset.i !== curTab) selectTab(+best.dataset.i);
  else sfx.move();
  applyCursor(true);
}
function goBack() {
  if (!$('confirm').hidden) $('delNo').click();
  else if (!$('viewer').hidden) $('viewClose').click();
  else if (!$('album').hidden) $('albumClose').click();
  else if (document.body.classList.contains('done')) $('btnBack').click();
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowLeft') moveCursor(-1, 0);
  else if (k === 'ArrowRight') moveCursor(1, 0);
  else if (k === 'ArrowUp') moveCursor(0, -1);
  else if (k === 'ArrowDown') moveCursor(0, 1);
  else if (k === 'Enter' || k === ' ') {
    if (!e.repeat) {
      const cur = applyCursor(true);
      // しゅるいの ボタンで きめると、その なかみへ すすむ
      if (cur && cur.classList.contains('tab')) { sfx.tab(); setCursor('item-' + state[CATS[curTab].k]); }
      else if (cur) cur.click();
    }
  }
  else if (k === 'Escape' || k === 'Backspace') goBack();
  else if (/^[0-9]$/.test(k) && scopeEl().id === 'panel') { const i = k === '0' ? 9 : +k - 1; curKey.panel = 'tab-' + i; selectTab(i); applyCursor(true); }
  else if (k === 'm' || k === 'M') $('btnSound').click();
  else return;
  e.preventDefault();
  document.body.classList.add('kbd');
});
document.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') document.body.classList.remove('kbd'); });
document.addEventListener('focusin', e => { if (e.target.blur) e.target.blur(); });
if (!('ontouchstart' in window)) document.body.classList.add('kbd');

/* ================= アルバムの がめん ================= */
let viewIdx = 0;
function renderAlbum() {
  $('albumGrid').innerHTML = album.length
    ? album.map((a, i) => `<button class="card" data-i="${i}" data-nav="card-${i}"><svg viewBox="0 0 400 620">${sceneHTML(a.s)}</svg><span class="date">${dateLabel(a.t)}</span></button>`).join('')
    : `<p class="empty">まだ なにも ないよ<br>「✨ できた!」を おすと ここに のこるよ</p>`;
}
function openAlbum() {
  renderAlbum();
  $('album').hidden = false;
  setCursor(album.length ? 'card-0' : 'close');
  sfx.tab(); speak('アルバム');
}
function showViewer(i) {
  viewIdx = i;
  $('viewSvg').innerHTML = sceneHTML(album[i].s);
  $('viewDate').textContent = `${dateLabel(album[i].t)} (${i + 1} / ${album.length})`;
  $('viewer').hidden = false; $('confirm').hidden = true; $('viewBtns').hidden = false;
  applyCursor();
}
function closeViewer() {
  $('viewer').hidden = true; $('confirm').hidden = true;
  if (album.length) setCursor('card-' + Math.min(viewIdx, album.length - 1)); else setCursor('close');
}
$('btnAlbum').addEventListener('click', openAlbum);
$('btnAlbum2').addEventListener('click', openAlbum);
$('albumClose').addEventListener('click', () => { $('album').hidden = true; sfx.tab(); applyCursor(); });
$('albumGrid').addEventListener('click', e => {
  const b = e.target.closest('.card'); if (!b) return;
  curKey.viewer = 'next'; showViewer(+b.dataset.i); sfx.on();
});
$('viewPrev').addEventListener('click', () => { showViewer((viewIdx - 1 + album.length) % album.length); sfx.tab(); });
$('viewNext').addEventListener('click', () => { showViewer((viewIdx + 1) % album.length); sfx.tab(); });
$('viewClose').addEventListener('click', () => { closeViewer(); sfx.tab(); });
$('viewPlay').addEventListener('click', () => {
  state = { ...album[viewIdx].s }; save();
  $('viewer').hidden = true; $('album').hidden = true;
  exitDone();
  renderDoll(); renderItems();
  sfx.on(); sparkle(200, 300, 16, 180);
});
$('viewDel').addEventListener('click', () => {
  $('viewBtns').hidden = true; $('confirm').hidden = false;
  setCursor('no'); sfx.tab();
});
$('delNo').addEventListener('click', () => { $('confirm').hidden = true; $('viewBtns').hidden = false; applyCursor(); sfx.tab(); });
$('delYes').addEventListener('click', () => {
  album.splice(viewIdx, 1); saveAlbum(); renderAlbum(); sfx.off();
  if (album.length) showViewer(Math.min(viewIdx, album.length - 1)); else closeViewer();
});

function sparkle(cx, cy, n = 7, spread = 60) {
  const fx = $('fx'), cols = ['#fff', '#ffe36b', '#ffb3d1', '#c5a3ff'];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = cx + (Math.random() - 0.5) * spread * 2, y = cy + (Math.random() - 0.5) * spread * 2;
    s += star(Math.round(x), Math.round(y), 8 + Math.random() * 10, cols[i % cols.length], `class="spark" style="animation-delay:${(Math.random() * 0.25).toFixed(2)}s"`);
  }
  g.innerHTML = s; fx.appendChild(g);
  setTimeout(() => g.remove(), 1200);
}

/* ================= そうさ ================= */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  curKey.panel = b.dataset.nav;
  selectTab(+b.dataset.i);
});

$('items').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const cat = CATS[curTab];
  let i = +b.dataset.i;
  curKey.panel = b.dataset.nav;
  // つけているものを もういちど おすと はずれる
  if (cat.list[0].none && i === state[cat.k]) i = 0;
  // トップス・ボトムスを えらぶと ドレスは ぬぐ
  if (isPart(cat.k)) state.dress = 0;
  state[cat.k] = i; save();
  renderDoll(cat.k); renderItems();
  if (cat.list[i].none) { sfx.off(); }
  else { sfx.on(); sparkle(cat.at[0], cat.at[1], 7, cat.k === 'dress' || cat.k === 'bottom' || cat.k === 'wings' || cat.k === 'bg' ? 120 : 50); speak(cat.list[i].n); }
});

$('btnRandom').addEventListener('click', () => {
  for (const c of CATS) {
    const min = c.list[0].none && Math.random() < 0.8 ? 1 : 0;
    state[c.k] = min + Math.floor(Math.random() * (c.list.length - min));
  }
  // はんぶんは ドレス、はんぶんは トップスと ボトムス
  state.dress = Math.random() < 0.5 ? 0 : 1 + Math.floor(Math.random() * (DRESSES.length - 1));
  save(); renderDoll(); renderItems();
  sfx.on(); sparkle(200, 300, 16, 180);
});

$('btnReset').addEventListener('click', () => {
  state = { ...DEFAULTS }; save();
  renderDoll(); renderItems(); sfx.off();
});

$('btnSound').addEventListener('click', () => {
  muted = !muted; save();
  $('btnSound').textContent = muted ? '🔇' : '🔊';
  if (muted && window.speechSynthesis) speechSynthesis.cancel();
  sfx.tab();
});

let sparkTimer = null;
$('btnDone').addEventListener('click', () => {
  addToAlbum();
  document.body.classList.add('done');
  setCursor('back');
  sfx.fanfare(); speak('わあ、すてきな おひめさま!');
  const stage = $('stage'), em = ['✨', '💖', '⭐', '🌸', '🎀', '💎'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (18 + Math.random() * 26) + 'px';
    s.style.animationDuration = (3 + Math.random() * 4) + 's';
    s.style.animationDelay = (-Math.random() * 6) + 's';
    stage.appendChild(s);
  }
  sparkle(200, 300, 18, 200);
  sparkTimer = setInterval(() => sparkle(200, 300, 6, 200), 900);
});

function exitDone() {
  document.body.classList.remove('done');
  clearInterval(sparkTimer);
  document.querySelectorAll('.confetti').forEach(n => n.remove());
  applyCursor();
}
$('btnBack').addEventListener('click', () => { exitDone(); sfx.tab(); });

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

$('btnSound').textContent = muted ? '🔇' : '🔊';
renderDoll(); renderTabs(); renderItems();
})();
</script>
</body>
</html>
